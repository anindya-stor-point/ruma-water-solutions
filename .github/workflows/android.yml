name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate or Restore Keystore
        run: |
          mkdir -p android/app
          cd android/app
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "No secret found. Generating a temporary keystore..."
            keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass rumawater123 -keypass rumawater123 -dname "CN=Ruma Water, OU=App, O=Ruma, L=City, ST=State, C=US"
            
            echo "=================================================="
            echo "!!! ACTION REQUIRED: PERMANENT KEYSTORE SETUP !!!"
            echo "=================================================="
            echo "Copy the following Base64 string and save it as a GitHub Secret named 'ANDROID_KEYSTORE_BASE64':"
            base64 -w 0 upload-keystore.jks
            echo -e "\n=================================================="
          else
            echo "Restoring keystore from secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          fi

      - name: Print Keystore Fingerprints
        run: |
          cd android/app
          echo "=================================================="
          echo "COPY THESE FINGERPRINTS TO FIREBASE CONSOLE:"
          echo "=================================================="
          keytool -list -v -keystore upload-keystore.jks -alias upload -storepass rumawater123 -keypass rumawater123
          echo "=================================================="

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Gradle Wrapper
        run: |
          mkdir -p android/gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar

      - name: Build Android APK (Release)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
